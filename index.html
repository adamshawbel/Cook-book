/* ========================== Timers ================================ */
let timers = [], audioCtx = null, timerTick = null;
function ensureAudio(){ try{ audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if(audioCtx.state === 'suspended') audioCtx.resume(); }catch(e){} }
function chime(){
  if(!audioCtx) return;
  const t0 = audioCtx.currentTime;
  [0, .22, .44, 1.1, 1.32, 1.54].forEach((d, i) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = [880, 1108.7, 1318.5][i % 3];
    g.gain.setValueAtTime(0.0001, t0+d); g.gain.exponentialRampToValueAtTime(0.35, t0+d+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0+d+0.5);
    o.connect(g).connect(audioCtx.destination); o.start(t0+d); o.stop(t0+d+0.55);
  });
}
const fmtClock = s => { s = Math.max(0, Math.ceil(s)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return h ? `${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}` : `${m}:${String(x).padStart(2,'0')}`; };
function startTimer(minutes, label, key){
  ensureAudio();
  const existing = timers.find(t => t.key === key && !t.done);
  if(existing){ stopTimer(existing.id); return; }
  timers.push({ id: uid(), key, label, end: Date.now() + minutes*60000, total: minutes*60, done:false, rang:0 });
  if(navigator.vibrate) try{ navigator.vibrate(30); }catch(e){}
  if(!timerTick) timerTick = setInterval(tickTimers, 250);
  tickTimers(); toast(`${fmtTime(minutes)} timer started`);
}
function stopTimer(id){ timers = timers.filter(t => t.id !== id); tickTimers(); if(!timers.length){ clearInterval(timerTick); timerTick = null; document.title = state.prefs.name; } }
function tickTimers(){
  const now = Date.now();
  for(const t of timers){
    const left = (t.end - now) / 1000;
    if(!t.done && left <= 0){ t.done = true; t.doneAt = now; toast(`⏰ Time’s up: ${t.label}`, { timeout:8000 }); }
    if(t.done && (now - (t.lastRing || 0)) > 4000 && t.rang < 15){ t.lastRing = now; t.rang++; chime(); if(navigator.vibrate) try{ navigator.vibrate([400,150,400,150,400]); }catch(e){} }
  }
  const dock = $('#timerDock');
  const html = timers.map(t => `<div class="tdock ${t.done ? 'done' : ''}" data-tid="${t.id}"><span class="tring" style="--p:${t.done ? 100 : Math.max(0, (t.end - now) / 10 / t.total)}">${icon('timer')}</span><span style="display:flex;flex-direction:column;min-width:0"><span class="time">${t.done ? 'Done!' : fmtClock((t.end - now)/1000)}</span><span class="lbl">${esc(t.label)}</span></span><button class="icon-btn" data-action="timer-stop" data-id="${t.id}" aria-label="${t.done ? 'Dismiss' : 'Cancel'} timer: ${esc(t.label)}">${icon(t.done ? 'check' : 'x', 'sm')}</button></div>`).join('');
  if(dock.dataset.sig !== timers.map(t => t.id + t.done).join()){ dock.innerHTML = html; dock.dataset.sig = timers.map(t => t.id + t.done).join(); }
  else timers.forEach(t => { const el = dock.querySelector(`[data-tid="${t.id}"] .time`); if(el) el.textContent = t.done ? 'Done!' : fmtClock((t.end - now)/1000); const rg = dock.querySelector(`[data-tid="${t.id}"] .tring`); if(rg) rg.style.setProperty('--p', t.done ? 100 : Math.max(0, (t.end - now) / 10 / t.total)); });
  const doneAny = timers.some(t => t.done);
  document.title = doneAny ? '⏰ Timer done!' : timers.length ? `${fmtClock(Math.min(...timers.map(t => (t.end - now)/1000)))} · ${state.prefs.name}` : state.prefs.name;
  refreshTimerChips();
}
function refreshTimerChips(){
  const now = Date.now();
  $$('[data-action="timer"]').forEach(b => {
    const key = `${b.dataset.rid || (currentRecipeId())}:${b.dataset.step}`;
    const t = timers.find(x => x.key === key);
    b.classList.toggle('running', !!t);
    const span = b.querySelector('span:last-child') || b;
    const txt = t ? (t.done ? 'Done! Tap to dismiss' : `${fmtClock((t.end - now)/1000)} – tap to cancel`) : (b.classList.contains('big') ? `Start ${fmtTime(+b.dataset.min)} timer` : `Start ${fmtTime(+b.dataset.min)} timer`);
    if(span.textContent !== txt) span.textContent = txt;
  });
}
function currentRecipeId(){ const m = location.hash.match(/^#\/recipe\/(.+)$/); return cook.open ? cook.id : m ? decodeURIComponent(m[1]) : ''; }

/* ============================ Cook mode =========================== */
const cook = { open:false, id:null, i:0, wake:null, touch:null };
function openCook(id, start = 0){
  const r = getRecipe(id); if(!r || !r.steps.length) return;
  Object.assign(cook, { open:true, id, i:Math.min(start, r.steps.length - 1) });
  const el = $('#cook'); el.hidden = false; document.body.style.overflow = 'hidden'; document.body.classList.add('cooking');
  $('#themeColor').setAttribute('content', '#120E0C');
  renderCook(0); requestWake(); ensureAudio();
  $('#cookNext')?.focus();
}
function closeCook(){
  const id = cook.id;
  cook.open = false; $('#cook').hidden = true; $('#cook').innerHTML = ''; document.body.style.overflow = ''; document.body.classList.remove('cooking');
  releaseWake(); closeDrawer(); applyTheme();
  if(location.hash.startsWith('#/cook/')){ history.replaceState(null, '', '#/recipe/' + encodeURIComponent(id)); route(); }
  else if(getRecipe(id) && location.hash.startsWith('#/recipe/')) route();
}
async function requestWake(){
  try{ if('wakeLock' in navigator){ cook.wake = await navigator.wakeLock.request('screen'); cook.wake.addEventListener('release', () => updateWake()); } }catch(e){ cook.wake = null; }
  updateWake();
}
function releaseWake(){ try{ cook.wake && cook.wake.release(); }catch(e){} cook.wake = null; }
function updateWake(){ const w = $('#wakeInd'); if(!w) return; const on = cook.wake && !cook.wake.released; w.classList.toggle('on', !!on); w.lastChild.textContent = on ? 'Screen stays on' : ('wakeLock' in navigator ? 'Screen may sleep' : 'Keep-awake not supported'); }
document.addEventListener('visibilitychange', () => { if(cook.open && document.visibilityState === 'visible') requestWake(); });
const NEED_STOP = new Set([...STOP, 'clove','cloves','pieces','bite','size','taste','sized','packet','water']);
function stepNeeds(r, text){
  const t = String(text).toLowerCase(), f = scaleFactor(r), sys = unitsFor(), out = [];
  for(const g of r.ingredients) for(const it of g.items){
    const words = normItem(shortName(it.item)).split(' ').filter(w => w.length >= 4 && !NEED_STOP.has(w));
    if(words.some(w => new RegExp(`\\b${escRe(w)}`).test(t))) out.push(ingredientText(it, f, sys));
  }
  return out.slice(0, 8);
}
function renderCook(dir){
  const r = getRecipe(cook.id), el = $('#cook'); if(!r) return closeCook();
  const n = r.steps.length, finished = cook.i >= n;
  const s = r.steps[Math.min(cook.i, n-1)];
  const mins = s.timerMinutes || detectTimer(s.text);
  const needs = finished ? [] : stepNeeds(r, s.text);
  const pad = x => String(x).padStart(2, '0');
  el.innerHTML = `
    <div class="cook-head">
      <button class="icon-btn outline" data-action="cook-close" aria-label="Exit cook mode">${icon('x')}</button>
      <div class="title"><b>${esc(r.title)}</b><span>${finished ? 'All done – bon appétit!' : `Step ${cook.i+1} of ${n}${ui.servings[r.id] && ui.servings[r.id] !== r.servings ? ` · for ${ui.servings[r.id]}` : ''}`}</span></div>
      <span class="wake" id="wakeInd" title="Keep-awake status"><i></i><span>…</span></span>
      <button class="btn sm" data-action="cook-ing" aria-haspopup="dialog" aria-label="Ingredients">${icon('list','sm')}<span>Ingredients</span></button>
    </div>
    <div class="cook-progress" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${Math.min(cook.i+1, n)}" aria-label="Progress">${r.steps.map((_, i) => `<i class="${i < cook.i || finished ? 'done' : i === cook.i ? 'cur' : ''}"></i>`).join('')}</div>
    <div class="cook-stage" id="cookStage" aria-live="polite">
      ${finished ? `<div class="cook-step finish ${dir > 0 ? 'from-right' : 'from-left'}"><div class="big" aria-hidden="true">🎉</div><h2 class="cook-text" style="font-weight:600">Enjoy your ${esc(r.title)}!</h2><p class="note">How did it turn out?</p><div data-stars style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center">${starsHTML(r)}</div><div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px"><button class="btn primary lg" data-action="cook-done">${icon('done')}I cooked this</button><button class="btn lg" data-action="cook-close">Close</button></div></div>`
      : `<div class="cook-step ${dir > 0 ? 'from-right' : dir < 0 ? 'from-left' : ''}">
        <div class="cook-num"><span class="n">${pad(cook.i+1)}</span><span class="of">of ${pad(n)}</span></div>
        <p class="cook-text">${stepTextHTML(s.text)}</p>
        ${needs.length ? `<div class="cook-needs"><div class="k">For this step</div><div class="list">${needs.map(x => `<span>${x.qty ? `<b>${esc(x.qty)}</b>` : ''}${esc(x.item)}</span>`).join('')}</div></div>` : ''}
        ${mins ? `<div class="cook-timer"><button class="btn primary big timer-cook" data-action="timer" data-rid="${esc(r.id)}" data-step="${cook.i}" data-min="${mins}" data-label="${esc(r.title)} · step ${cook.i+1}">${icon('timer')}<span>Start ${fmtTime(mins)} timer</span></button></div>` : ''}
      </div>`}
    </div>
    <div class="cook-foot">
      <button class="btn" data-action="cook-prev" ${cook.i === 0 ? 'disabled' : ''}>${icon('left')}Back</button>
      ${finished ? '' : `<button class="btn primary" id="cookNext" data-action="cook-next">${cook.i === n-1 ? 'Finish' : 'Next step'}${icon('right')}</button>`}
    </div>`;
  updateWake(); refreshTimerChips();
  const stage = $('#cookStage');
  stage.addEventListener('touchstart', e => { const t = e.changedTouches[0]; cook.touch = { x:t.clientX, y:t.clientY }; }, { passive:true });
  stage.addEventListener('touchend', e => { if(!cook.touch) return; const t = e.changedTouches[0], dx = t.clientX - cook.touch.x, dy = t.clientY - cook.touch.y; cook.touch = null; if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)*1.3) cookStep(dx < 0 ? 1 : -1); }, { passive:true });
}
function cookStep(d){ const r = getRecipe(cook.id); if(!r) return; const n = r.steps.length; const ni = Math.max(0, Math.min(n, cook.i + d)); if(ni === cook.i) return; cook.i = ni; renderCook(d); if(navigator.vibrate) try{ navigator.vibrate(10); }catch(e){} }
function openDrawer(){

function closeDrawer(){ $('#drawer')?.remove(); $('#drawerBack')?.remove(); }

/* ============================ Random ============================= */
function randomRecipe(){ spinDialog(); }

/* ============================ Events ============================= */
document.addEventListener('click', async e => {
  const a = e.target.closest('[data-action]'); if(!a) return;
  const act = a.dataset.action;
  const rid = currentRecipeId();
  switch(act){
    case 'toggle-theme': state.prefs.theme = effectiveTheme() === 'dark' ? 'light' : 'dark'; save(); applyTheme(); if(location.hash === '#/more') renderMore(); break;
    case 'focus-search': if(location.hash.replace(/^#\/?/, '') !== ''){ go('#/'); } setTimeout(() => $('#q')?.focus(), 60); break;
    case 'random': case 'spin': spinDialog(); break;
    case 'feature-next': { e.preventDefault(); ui.featured++; const fc = $('#featureCard'); const r = dayPick(allRecipes()); if(fc && r){ fc.outerHTML = featureCardHTML(r, 'Recipe of the day'); $('#featureCard').animate([{ opacity:0, transform:'translateY(8px)' }, { opacity:1, transform:'none' }], { duration:350, easing:'ease-out' }); } break; }
    case 'set-view': state.prefs.view = a.dataset.v; save(); $$('[data-action="set-view"]').forEach(b => b.setAttribute('aria-pressed', b === a)); $('#results')?.classList.toggle('list-mode', state.prefs.view === 'list'); break;
    case 'rate': { const id = currentRecipeId(); if(id) setRating(id, +a.dataset.n); break; }
    case 'collect': { const r = getRecipe(rid); if(r) collectDialog(r); break; }
    case 'new-col': newCollectionDialog(); break;
    case 'open-col': e.preventDefault(); ui.cat = 'col:' + a.dataset.id; ui.q = ''; ui.tag = ''; if(location.hash.replace(/^#\/?/, '') !== '') go('#/'); else renderLibrary(); setTimeout(() => $('#libHead')?.scrollIntoView({ behavior:'smooth', block:'start' }), 80); break;
    case 'del-col': { const c = state.collections.find(x => x.id === a.dataset.id); if(c && await confirmDialog({ title:`Delete “${c.name}”?`, message:'The collection is removed. Your recipes stay in the cookbook.', confirmText:'Delete collection', danger:true })){ state.collections = state.collections.filter(x => x !== c); ui.cat = 'all'; save(); renderLibrary(); toast('Collection deleted'); } break; }
    case 'r-tab': ui.tab = a.dataset.tab; $('#rGrid')?.setAttribute('data-tab', ui.tab); $$('[data-action="r-tab"]').forEach(b => b.setAttribute('aria-selected', b === a)); { const t = $('.r-tabs'); if(t && t.getBoundingClientRect().top <= 1) t.scrollIntoView({ block:'start' }); } break;
    case 'back': e.preventDefault(); if(ui.navCount > 1) history.back(); else go('#/'); break;
    case 'fridge-add': addPantry(a.dataset.v); break;
    case 'fridge-del': state.pantry.splice(+a.dataset.i, 1); save(); renderFridge(); break;
    case 'fridge-clear': state.pantry = []; save(); renderFridge(); break;
    case 'fridge-shop': { const r = getRecipe(a.dataset.id); if(!r) break; const m = matchRecipe(r); for(const it of m.need){ const pq = parseQty(it.qty); if(pq){ const c = convert(pq.max, it.unit, state.prefs.units); addShopItem({ qty:c.qty, unit:c.unit, item:it.item, source:r.title }); } else addShopItem({ qty:it.qty || '', unit:'', item:it.item, source:r.title }); } save(); updateChrome(); toast(`Added ${m.need.length} missing item${m.need.length === 1 ? '' : 's'} to your list`, { action:{ label:'View list', fn:() => go('#/shopping') } }); break; }
    case 'import': $('#importFile').click(); break;
    case 'export': exportBackup(); break;
    case 'export-builtin': {
      const list = allRecipes().map(r => { const o = {}; for(const k of ['id','title','description','category','cuisine','tags','servings','prepTime','cookTime','difficulty','ingredients','steps','tips','photo','source','dateAdded','favourite','emoji','color']) if(r[k] !== undefined) o[k] = r[k]; return o; });
      download(`built-in-recipes-${todayISO()}.js`, `const BUILT_IN_RECIPES = ${JSON.stringify(list, null, 2)};\n`, 'text/javascript'); toast('Exported – paste it over the BUILT_IN_RECIPES line'); break; }
    case 'erase': if(await confirmDialog({ title:'Erase everything?', message:'This deletes all recipes added on this device, your notes, planner and shopping list. Export a backup first if you might want them back.', confirmText:'Erase everything', danger:true })){ const prefs = state.prefs; state = clone(DEFAULT_STATE); state.prefs = prefs; invalidate(); save(); toast('All data erased'); go('#/'); } break;
    case 'set-theme': state.prefs.theme = a.dataset.t; save(); applyTheme(); renderMore(); break;
    case 'set-units': state.prefs.units = a.dataset.u; ui.units = null; save(); renderMore(); break;
    case 'clear-filters': ui.q = ''; ui.cat = 'all'; ui.tag = ''; renderLibrary(); setTimeout(() => $('#libHead')?.scrollIntoView({ block:'start' }), 60); break;
    case 'fav': { e.preventDefault(); const id = a.dataset.id, r = getRecipe(id); if(!r) break; setFav(id, !r.favourite);
      const on = !r.favourite; $$(`[data-action="fav"][data-id="${CSS.escape(id)}"]`).forEach(b => { b.setAttribute('aria-pressed', on); b.setAttribute('aria-label', (on ? 'Remove from' : 'Add to') + ' favourites' + (b.classList.contains('fav-btn') ? ': ' + r.title : '')); if(b.classList.contains('fav-inline')){ b.style.color = on ? '#E0473A' : ''; const svg = b.querySelector('svg'); svg.style.fill = on ? 'currentColor' : ''; } });
      toast(on ? 'Added to favourites' : 'Removed from favourites'); if(ui.cat === 'fav' && $('#results')) updateResults(); break; }
    case 'tag': e.preventDefault(); ui.tag = a.dataset.tag; ui.cat = 'all'; ui.q = ''; go('#/'); setTimeout(() => $('#libHead')?.scrollIntoView({ block:'start' }), 80); break;
    case 'serv': { const r = getRecipe(rid); if(!r) break; const cur = ui.servings[r.id] || r.servings; ui.servings[r.id] = Math.max(1, Math.min(99, cur + +a.dataset.d)); refreshIngredients(r); break; }
    case 'units': ui.units = a.dataset.u; { const r = getRecipe(rid); if(r) { refreshIngredients(r); $$('.seg [data-action="units"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.u === ui.units)); $$('.steps li').forEach((li, i) => { const p = li.querySelector('.step-text'); if(p) p.innerHTML = `<span class="sr-only">Step ${i+1}: </span>` + stepTextHTML(r.steps[i].text); }); } } break;
    case 'cook': openCook(rid, 0); break;
    case 'cooked': markCooked(rid); a.classList?.add('on'); setTimeout(() => a.classList?.remove('on'), 900); break;
    case 'add-shop': { const r = getRecipe(rid); if(!r) break; const s = ui.servings[r.id] || r.servings; const n = addRecipeToShopping(r, s); save(); updateChrome(); toast(`Added ${n} ingredient${n === 1 ? '' : 's'}${s ? ` for ${s}` : ''} to your list`, { action:{ label:'View list', fn:() => go('#/shopping') } }); break; }
    case 'plan-recipe': { const r = getRecipe(rid); if(r) planRecipeDialog(r); break; }

    case 'timer': { const key = `${a.dataset.rid || rid}:${a.dataset.step}`; const t = timers.find(x => x.key === key); if(t) stopTimer(t.id); else startTimer(+a.dataset.min, a.dataset.label, key); break; }
    case 'timer-stop': stopTimer(a.dataset.id); break;

    case 'cook-prev': cookStep(-1); break;
    case 'cook-ing': openDrawer(); break;
    case 'drawer-close': closeDrawer(); $('[data-action="cook-ing"]')?.focus(); break;

    case 'shop-del': state.shopping = state.shopping.filter(i => i.id !== a.dataset.id); save(); renderShopping(); updateChrome(); break;
    case 'shop-clear-ticked': state.shopping = state.shopping.filter(i => !i.checked); save(); renderShopping(); updateChrome(); toast('Ticked items cleared'); break;
    case 'shop-clear-all': if(await confirmDialog({ title:'Clear the whole list?', message:'All items will be removed from your shopping list.', confirmText:'Clear list', danger:true })){ const old = state.shopping; state.shopping = []; save(); renderShopping(); updateChrome(); toast('List cleared', { action:{ label:'Undo', fn:() => { state.shopping = old; save(); renderShopping(); updateChrome(); } } }); } break;
    case 'shop-share': shareText('Shopping list', shoppingText()); break;

    case 'week-shop': { let n = 0, recipes = 0; for(const d of weekDays(ui.weekOffset)){ const plan = state.planner[isoDate(d)] || {}; for(const [k] of MEALS) for(const e2 of (plan[k] || [])){ const r = e2.recipeId && getRecipe(e2.recipeId); if(r){ n += addRecipeToShopping(r, e2.servings || r.servings); recipes++; } } }
      save(); updateChrome(); toast(recipes ? `Added ingredients from ${recipes} meal${recipes === 1 ? '' : 's'}` : 'No recipes planned this week', { action: recipes ? { label:'View list', fn:() => go('#/shopping') } : null }); break; }
    case 'week-clear': if(await confirmDialog({ title:'Clear this week?', message:'Everything planned for this week will be removed.', confirmText:'Clear week', danger:true })){ for(const d of weekDays(ui.weekOffset)) delete state.planner[isoDate(d)]; save(); renderPlanner(); } break;
    case 'parse': { const v = $('#pasteIn').value; applyParsed(parseRecipeText(v)); break; }
    case 'paste-clip': try{ const t = await navigator.clipboard.readText(); $('#pasteIn').value = t; applyParsed(parseRecipeText(t)); }catch(err){ toast('Clipboard not available – paste into the box instead', { error:true }); $('#pasteIn').focus(); } break;
    case 'cancel-form': if(!draftDirty || await confirmDialog({ title:'Discard changes?', message:'Your unsaved changes will be lost.', confirmText:'Discard', danger:true })){ draftDirty = false; draftIsNew ? go('#/') : go('#/recipe/' + encodeURIComponent(draft.id)); } break;
    case 'delete-recipe': if(await confirmDialog({ title:`Delete “${draft.title}”?`, message:'This recipe, its notes and cooking history will be permanently deleted from this device.', confirmText:'Delete recipe', danger:true })){ deleteRecipe(draft.id); draftDirty = false; toast('Recipe deleted'); go('#/'); } break;
    default: if(/^(i|g|s)-(add|del|up|down)$|^photo-remove$/.test(act)) formStructural(act, a);
  }
});
function refreshIngredients(r){
  const box = $('#ingList'); if(box) box.innerHTML = ingredientsHTML(r);
  const out = $('.stepper output'); const s = ui.servings[r.id] || r.servings; if(out) out.textContent = `${s} serving${s === 1 ? '' : 's'}`;
}
document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.tick){ const set = ui.ticks[t.dataset.rid] || (ui.ticks[t.dataset.rid] = new Set()); t.checked ? set.add(t.dataset.tick) : set.delete(t.dataset.tick); $$(`[data-tick="${t.dataset.tick}"][data-rid="${CSS.escape(t.dataset.rid)}"]`).forEach(x => x.checked = t.checked); }
  if(t.dataset.shop){ const it = state.shopping.find(i => i.id === t.dataset.shop); if(it){ it.checked = t.checked; save(); updateChrome(); setTimeout(renderShopping, 260); } }
  if(t.id === 'importFile' && t.files[0]){ importBackup(t.files[0]); t.value = ''; }
});
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName) || document.activeElement?.isContentEditable;
  if(e.key === 'Escape'){
    if(modalStack.length){ modalStack[modalStack.length-1].close(); return; }
    if($('#drawer')){ closeDrawer(); return; }
    if(cook.open){ closeCook(); return; }
  }
  if(cook.open && !modalStack.length){
    if(e.key === 'ArrowRight' || (e.key === ' ' && !typing && document.activeElement?.tagName !== 'BUTTON')){ e.preventDefault(); cookStep(1); }
    else if(e.key === 'ArrowLeft'){ e.preventDefault(); cookStep(-1); }
    return;
  }
  if(e.key === '/' && !typing && !modalStack.length && !e.metaKey && !e.ctrlKey){
    e.preventDefault();
    if(location.hash.replace(/^#\/?/, '') !== '') go('#/');
    setTimeout(() => { const q = $('#q'); if(q){ q.focus(); q.select(); } }, 30);
  }
});
window.addEventListener('scroll', () => $('.topbar')?.classList.toggle('scrolled', scrollY > 4), { passive:true });
window.addEventListener('beforeunload', e => { if(draftDirty && /^#\/(new|edit)/.test(location.hash)){ e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('hashchange', () => { if(cook.open) closeCook(); while(modalStack.length) modalStack[modalStack.length-1].close(); route(); });
window.addEventListener('storage', e => { if(e.key === STORE_KEY){ state = load(); invalidate(); route(); } });

// Expose a tiny API for debugging/testing in the console.
window.Cookbook = { get state(){ return state; }, allRecipes, parseRecipeText, parseIngredientLine, fmtNum, convert };
})();
